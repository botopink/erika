# Per-platform CI for erika.
#
# Rows: the targets the workspace's manifests declare (1.0.11-beta 00-gate,
# gate-j) on the runners the compiler itself is gated on, linux and macos.
# The workspace `botopink.json` declares no `targets` and no member narrows
# one, so every member runs on the two targets `botopink test` runs.
# Every row is hard: no `allow_fail`, no `continue-on-error`. No `beam` row
# (`botopink test` cannot run beam; a row that prints "skipped" measures
# nothing). No windows row (gate-f): botopink-lang's own workflow has none, so
# a row here would measure the compiler's windows port, not this library; it
# returns with the compiler's.
#
# The linux runner is ubuntu-24.04, not 22.04: botopink-lang's `build.zig` links
# the compiler against a pinned glibc 2.38 and the binary imports
# `arc4random_buf` (GLIBC_2.36); ubuntu-22.04 ships glibc 2.35 and cannot start
# it (`version 'GLIBC_2.36' not found`).
#
# Bootstrap: check out this lib + botopink-lang, place this lib under
# `botopink-lang/repository/erika/`
# build the compiler,
# then one `botopink-lib-test --target <row> --strict` call per row, from a
# scratch directory with `BOTOPINK_LIB_ROOTS` naming this repository: the runner
# discovers every member the workspace declares (decision 75: the umbrella is
# not a cell, its members are — nothing is listed by hand here) and runs
# `botopink test` in each on the row's target. A member whose manifest excludes
# the row's target is not a cell of that row. The scratch directory keeps the
# runner's walk-up from adding any other root: the sibling libraries and the
# compiler's own `libs/` are dependencies, not rows, so this workflow's verdict
# is this library's.
#
# Then the pre-commit hook's other stages, on every row: the repository's own
# stages (`scripts/git-hooks/repository-stages.sh`, when the repository has
# one), every `examples/*/` built on the row's target, every `refusals/*/` case
# refused (when the repository has that directory).
#
# `BOTOPINK_LANG_REF` (repo variable, default `feat`) pins a botopink-lang ref.
name: test

on:
  push:
    branches: [feat, master, main]
  pull_request:
    branches: [feat, master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: erika
  BOTOPINK_LANG_REPO: botopink/botopink-lang

jobs:
  test:
    name: ${{ matrix.runner }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: commonJS }
          - { runner: ubuntu-24.04, target: erlang }
          - { runner: macos-14,     target: commonJS }
          - { runner: macos-14,     target: erlang }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this lib
        uses: actions/checkout@v5
        with:
          path: self

      - name: Checkout botopink-lang
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOTOPINK_LANG_REPO }}
          ref: ${{ vars.BOTOPINK_LANG_REF || 'feat' }}
          path: botopink-lang

      - name: Place lib under botopink-lang/repository/${{ env.LIB_NAME }}/
        shell: bash
        run: |
          mkdir -p botopink-lang/repository
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete self/ "botopink-lang/repository/${LIB_NAME}/"
          else
            rm -rf "botopink-lang/repository/${LIB_NAME}"
            cp -R self "botopink-lang/repository/${LIB_NAME}"
          fi

      # Both hosts on every row. Building the compiler runs `erlc` (the
      # resident comptime modules are compiled at build time and embedded),
      # and comptime evaluation spawns `erl` whatever the row's target — so
      # a `commonJS` row needs Erlang/OTP exactly as an `erlang` row does.
      # OTP 28, as botopink-lang's own workflow: the comptime runtime writes
      # JSON via `json:encode/1` (OTP 27+).
      - name: Install Erlang/OTP (linux)
        if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'

      - name: Install Erlang/OTP (macos)
        if: runner.os == 'macOS'
        run: |
          brew install erlang@28 && brew link --force erlang@28
          echo "$(brew --prefix erlang@28)/bin" >> "$GITHUB_PATH"

      # Decision 227: OTP 28 on every row, linux and macos alike — `erlang@28`
      # is keg-only, so its `bin` goes on PATH above; any other release here
      # fails the job rather than testing against it.
      - name: Assert Erlang/OTP 28
        shell: bash
        run: |
          otp="$(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')"
          [ "$otp" = 28 ] || { echo "Erlang/OTP is '$otp', not 28 (decision 227)"; exit 1; }

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # H7 (v0.beta.19) — release fast path. Opt-in via the lib's
      # `BOTOPINK_USE_RELEASE_FASTPATH` repo variable. Set to `true` after
      # botopink-lang has published at least one tagged release; until then,
      # the source path below is the default.
      - name: Install botopink (release fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://botopink.dev/install.sh | sh
          echo "$HOME/.bpmp/bin" >> "$GITHUB_PATH"

      - name: Install Zig (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build install (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: |
          zig build install
          echo "$GITHUB_WORKSPACE/botopink-lang/zig-out/bin" >> "$GITHUB_PATH"

      # One compiler for every step below — the cells, the suites that build
      # fixtures (they read `BOTOPINK_BIN`) and the hook's stages: the one just
      # built, or the released one on the fast path. A miss fails the job.
      - name: Export BOTOPINK_BIN and print the build identity
        shell: bash
        run: |
          bin="$(command -v botopink)" || { echo "botopink is not on PATH"; exit 1; }
          command -v botopink-lib-test >/dev/null || { echo "botopink-lib-test is not on PATH"; exit 1; }
          echo "BOTOPINK_BIN=$bin" >> "$GITHUB_ENV"
          echo "lib:      ${LIB_NAME} @ $(git -C self rev-parse HEAD)"
          echo "compiler: $bin @ $(git -C botopink-lang rev-parse HEAD) (ref ${{ vars.BOTOPINK_LANG_REF || 'feat' }})"
          echo "row:      ${{ matrix.runner }} · ${{ matrix.target }}"
          echo "fastpath: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH }}"
          erl -noshell -eval 'io:format("otp:      ~s~n", [erlang:system_info(otp_release)]), halt().'

      # Every member of the workspace — modules, examples, whatever the root
      # manifest's `workspaces` declares — on this row's target. `--strict`: a
      # cell the runner cannot run is a failure, never a skip.
      - name: botopink-lib-test · every member · ${{ matrix.target }}
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/botopink-lang/repository/${LIB_NAME}"
          cd "$(mktemp -d)"
          BOTOPINK_LIB_ROOTS="$root" botopink-lib-test --bin "$BOTOPINK_BIN" --target "${{ matrix.target }}" --strict

      # The pre-commit hook's other stages, from the hook's own runner: no row
      # is "the one that checks examples".
      - name: Repository stages, examples build, refusals · ${{ matrix.target }}
        working-directory: botopink-lang/repository/${{ env.LIB_NAME }}
        shell: bash
        run: |
          source scripts/git-hooks/lib/runner-standalone.sh
          bin=$(requireBotopink)
          runRepositoryStagesGate
          runExamplesGate "$bin" "${{ matrix.target }}"
          runRefusalsGate "$bin"
