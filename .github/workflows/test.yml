# Per-platform CI for erika.
#
# The matrix is the manifests' target set (1.0.11-beta 00-gate, gate-j): the
# workspace `botopink.json` declares no `targets` and no member narrows one,
# so every member runs on the two targets `botopink test` can run — the rows
# are `commonJS` and `erlang` on linux and macos, plus `commonJS` on windows
# (`escript` ships cleanly only on linux + macos). No `beam` row: `botopink
# test` cannot run beam, so such a row printed `skipped` and passed — a row
# that measures nothing is not a row. Every row is hard — no `allow_fail`,
# no `continue-on-error`.
#
# Bootstrap: check out this lib + botopink-lang, place this lib under
# `botopink-lang/repository/erika/`, build the compiler, run
# `botopink-lib-test --target <matrix.target>` from the botopink-lang checkout.
# The runner discovers every project the checkout holds — this workspace's
# members (`modules/*`, `examples/*`, one row each by manifest name; the
# umbrella has no row, decision 75) and the compiler's own `libs/std` — and
# runs `botopink test` in each on the row's target. `--lib` takes one name
# (`--lib erika` selects the core member only), so the whole workspace is one
# call without it: no hand-written member loop, and `std` rides along because
# the runner has no workspace selector.
#
# Then the examples gate (runExamplesGate, the pre-commit hook's stage) builds
# every `examples/*/` with its own manifest target, on every row, and the
# refusals gate checks every `refusals/*/` case — the hook's stages, in CI.
name: test

on:
  push:
    branches: [feat, master, main]
  pull_request:
    branches: [feat, master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: erika
  BOTOPINK_LANG_REPO: botopink/botopink-lang

jobs:
  test:
    name: ${{ matrix.runner }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: commonJS }
          - { runner: ubuntu-22.04, target: erlang }
          - { runner: macos-14,     target: commonJS }
          - { runner: macos-14,     target: erlang }
          - { runner: windows-2022, target: commonJS }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this lib
        uses: actions/checkout@v5
        with:
          path: self

      - name: Checkout botopink-lang
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOTOPINK_LANG_REPO }}
          ref: ${{ vars.BOTOPINK_LANG_REF || 'feat' }}
          path: botopink-lang

      - name: Place lib under botopink-lang/repository/${{ env.LIB_NAME }}/
        shell: bash
        run: |
          mkdir -p botopink-lang/repository
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete self/ "botopink-lang/repository/${LIB_NAME}/"
          else
            rm -rf "botopink-lang/repository/${LIB_NAME}"
            cp -R self "botopink-lang/repository/${LIB_NAME}"
          fi

      - name: Install erlang (linux)
        if: matrix.runner == 'ubuntu-22.04' && matrix.target == 'erlang'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y erlang

      - name: Install erlang (macos)
        if: matrix.runner == 'macos-14' && matrix.target == 'erlang'
        run: brew install erlang

      - name: Install Node 20 (for commonJS target)
        if: matrix.target == 'commonJS'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # H7 (v0.beta.19) — release fast path. Opt-in via the lib's
      # `BOTOPINK_USE_RELEASE_FASTPATH` repo variable. Set to `true` after
      # botopink-lang has published at least one tagged release; until then,
      # the source path below is the default.
      - name: Install botopink (release fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        shell: bash
        run: |
          if [ "${{ matrix.runner }}" = "windows-2022" ]; then
            powershell -ExecutionPolicy Bypass -Command "iwr https://botopink.dev/install.ps1 -UseBasicParsing | iex"
            echo "$USERPROFILE\\.bpmp\\bin" >> $GITHUB_PATH
          else
            curl --proto '=https' --tlsv1.2 -sSfL https://botopink.dev/install.sh | sh
            echo "$HOME/.bpmp/bin" >> $GITHUB_PATH
          fi

      - name: Install Zig (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build install (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        run: zig build install

      # Every member and every example of the workspace, one row each, on this
      # row's target (the runner reads each manifest's `targets`).
      - name: botopink-lib-test --target ${{ matrix.target }} (source)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: zig-out/bin/botopink-lib-test --bin zig-out/bin/botopink --target "${{ matrix.target }}"

      - name: botopink-lib-test --target ${{ matrix.target }} (fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: botopink-lib-test --target "${{ matrix.target }}"

      # Every examples/*/ with a botopink.json builds (runExamplesGate) and
      # every refusals/*/ case is refused (runRefusalsGate) — the pre-commit
      # hook's stages, on every row: no row is "the one that checks examples".
      - name: Examples build and refusals
        working-directory: botopink-lang/repository/${{ env.LIB_NAME }}
        shell: bash
        run: |
          source scripts/git-hooks/lib/runner-standalone.sh
          bin=$(requireBotopink)
          runExamplesGate "$bin"
          runRefusalsGate "$bin"
